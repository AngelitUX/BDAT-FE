[tool:pytest]
# Configuración de pytest para BDAT

# Directorios donde buscar tests
testpaths = test

# Patrones de archivos de test
python_files = test_*.py *_test.py

# Patrones de clases de test
python_classes = Test*

# Patrones de funciones de test
python_functions = test_*

# Markers personalizados
markers =
    unit: Tests unitarios puros (sin dependencias externas)
    integration: Tests de integración (requieren servicios externos)
    slow: Tests que toman mucho tiempo en ejecutar
    fenics: Tests que requieren FEniCS
    database: Tests que requieren base de datos
    api: Tests de API endpoints

# Opciones por defecto
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --color=yes

# Configuración de cobertura
# (se puede activar con --cov)
# --cov=src
# --cov-report=term-missing
# --cov-report=html:htmlcov
# --cov-report=xml

# Directorio de archivos temporales de pytest
cache_dir = .pytest_cache

# Configuración de logging
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Filtros de warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::UserWarning:matplotlib.*
