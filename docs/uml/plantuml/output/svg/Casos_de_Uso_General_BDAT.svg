@startuml Casos_de_Uso_General_BDAT
!theme plain
skinparam packageStyle rectangle

title Diagrama de Casos de Uso - Sistema BDAT\nBone Guided Wave Simulation Platform

left to right direction

actor "Investigador\nCientífico" as Investigador

rectangle "Sistema BDAT" {
  
  package "Gestión de Simulaciones" {
    usecase "CU-01.1\nCrear Simulación" as UC011
    usecase "CU-01.2\nVisualizar Simulación" as UC012
    usecase "CU-01.3\nEditar Simulación" as UC013
    usecase "CU-01.4\nDuplicar Simulación" as UC014
    usecase "CU-01.5\nEliminar Simulación(es)" as UC015
  }
  
  package "Ejecución" {
    usecase "CU-02.1\nEjecutar Simulación" as UC021
    usecase "CU-02.2\nRe-ejecutar Simulación" as UC022
    usecase "CU-02.3\nAbortar Simulación" as UC023
  }
  
  package "Cola de Ejecución" {
    usecase "CU-03.1\nVer Cola" as UC031
    usecase "CU-03.2\nReordenar Cola" as UC032
    usecase "CU-03.3\nDesencolar Simulación" as UC033
  }
  
  package "Visualización" {
    usecase "CU-04.1\nVer Malla 3D" as UC041
    usecase "CU-04.2\nDescargar Malla" as UC042
  }
  
  package "Análisis de Resultados" {
    usecase "CU-05.1\nVisualizar Señales\nEspacio-Temporales" as UC051
    usecase "CU-05.2\nVisualizar Valores\nSingulares (SVD)" as UC052
    usecase "CU-05.3\nVisualizar Espectro f-k" as UC053
    usecase "CU-05.4\nDescargar Resultados" as UC054
  }
  
  package "Búsqueda y Filtrado" {
    usecase "CU-06\nBuscar y Filtrar\nSimulaciones" as UC06
  }
  
  package "Monitoreo" {
    usecase "CU-07.1\nVer Estadísticas" as UC071
    usecase "CU-07.2\nVer Simulaciones\nActivas" as UC072
    usecase "CU-07.3\nRecibir\nNotificaciones" as UC073
  }
  
  usecase "Validar Datos" as ValidarDatos <<include>>
  usecase "Generar Malla" as GenerarMalla <<include>>
  usecase "Encolar Simulación" as Encolar <<include>>
  usecase "Confirmar Acción" as Confirmar <<include>>
  
}

actor "Sistema\nFEniCS" as FEniCS
actor "Sistema\nGMSH" as GMSH
actor "Sistema\nWebSocket" as WebSocket

Investigador - -> UC011
Investigador - -> UC012
Investigador - -> UC013
Investigador - -> UC014
Investigador - -> UC015

Investigador - -> UC021
Investigador - -> UC022
Investigador - -> UC023

Investigador - -> UC031
Investigador - -> UC032
Investigador - -> UC033

Investigador - -> UC041
Investigador - -> UC042

Investigador - -> UC051
Investigador - -> UC052
Investigador - -> UC053
Investigador - -> UC054

Investigador - -> UC06

Investigador - -> UC071
Investigador - -> UC072
Investigador - -> UC073

UC011 ..> ValidarDatos : <<include>>
UC011 ..> GenerarMalla : <<include>>
UC013 ..> ValidarDatos : <<include>>
UC013 ..> GenerarMalla : <<include>>
UC015 ..> Confirmar : <<include>>

UC021 ..> Encolar : <<include>>
UC022 ..> Encolar : <<include>>

UC013 .> UC012 : <<extend>>\n[Estado: Not started]
UC022 .> UC021 : <<extend>>\n[Estado: Finished|Error]
UC023 .> UC021 : <<extend>>\n[Estado: Running]

GenerarMalla - -> GMSH
UC021 - -> FEniCS
UC022 - -> FEniCS
WebSocket - -> UC073

@enduml

