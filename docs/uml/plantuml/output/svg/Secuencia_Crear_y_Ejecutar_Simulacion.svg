@startuml Secuencia_Crear_y_Ejecutar_Simulacion
!theme plain

title Diagrama de Secuencia del Sistema (DSS)\nCrear y Ejecutar Simulación

actor "Investigador" as User
participant "Frontend\n(React)" as Frontend
participant "Backend\n(Flask)" as Backend
participant "GMSH" as GMSH
participant "FEniCS" as FEniCS
participant "WebSocket" as WS
database "Base de\nDatos" as DB

== Crear Simulación ==

User -> Frontend : Click "New Simulation"
activate Frontend

User -> Frontend : Ingresa parámetros\n(geometría, sensores, material)

User -> Frontend : Click "Create"

Frontend -> Backend : POST /simulations\n{parámetros}
activate Backend

Backend -> Backend : ValidarDatos()

Backend -> DB : INSERT simulation
activate DB
DB - -> Backend : simulation_id
deactivate DB

Backend -> WS : emit("nueva_simulacion")
activate WS
WS - -> Frontend : Notificación
deactivate WS

Backend - -> Frontend : 200 OK\n{simulation_id}

Backend -> GMSH : Generar Malla\n(async task)
activate GMSH

GMSH -> GMSH : Crear geometría
GMSH -> GMSH : Refinar malla
GMSH -> GMSH : Guardar XML/MSH

GMSH - -> Backend : Archivos generados
deactivate GMSH

Backend -> DB : UPDATE\nxml_file, msh_file\nstatus="Not started"
activate DB
DB - -> Backend : OK
deactivate DB

Backend -> WS : emit("mesh_ready")
activate WS
WS - -> Frontend : Notificación
deactivate WS

Frontend -> Frontend : Actualizar lista
deactivate Frontend

== Ejecutar Simulación ==

User -> Frontend : Click "Execute"
activate Frontend

Frontend -> Backend : PUT /simulations/{id}/run
activate Backend

Backend -> Backend : Encolar()

Backend -> DB : UPDATE status="Queued"
activate DB
DB - -> Backend : OK
deactivate DB

Backend -> WS : emit("estado_simulacion")\nstatus="Queued"
activate WS
WS - -> Frontend : Notificación
deactivate WS

Backend - -> Frontend : 200 OK

Backend -> Backend : Procesar Cola

Backend -> DB : UPDATE status="Running"
activate DB
DB - -> Backend : OK
deactivate DB

Backend -> WS : emit("estado_simulacion")\nstatus="Running"
activate WS
WS - -> Frontend : Notificación
deactivate WS

Backend -> FEniCS : Ejecutar simulación\n(parámetros)
activate FEniCS

FEniCS -> FEniCS : Cargar malla XML
FEniCS -> FEniCS : Configurar FEniCS\n(function spaces, BC)
FEniCS -> FEniCS : Newmark β-γ\n(iteración temporal)
FEniCS -> FEniCS : Resolver ecuaciones\nelastodinámicas
FEniCS -> FEniCS : Evaluar sensores\n(sol_sensors_y, _z)
FEniCS -> FEniCS : Generar archivo .mat

FEniCS - -> Backend : Resultados.mat
deactivate FEniCS

Backend -> DB : UPDATE\nfile_data (BLOB)\nstatus="Finished"\nend_datetime
activate DB
DB - -> Backend : OK
deactivate DB

Backend -> WS : emit("estado_simulacion")\nstatus="Finished"
activate WS
WS - -> Frontend : Notificación
Frontend -> Frontend : Reproducir sonido 🔔
deactivate WS

deactivate Backend

Frontend -> Frontend : Actualizar UI
User <- - Frontend : Visualiza "Finished"
deactivate Frontend

@enduml

