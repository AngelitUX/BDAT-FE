@startuml Secuencia_Visualizar_Resultados
!theme plain

title Diagrama de Secuencia del Sistema (DSS)\nVisualizar Resultados de Simulación

actor "Investigador" as User
participant "Frontend" as Frontend
participant "Backend" as Backend
participant "results_processor" as Processor
database "Base de Datos" as DB

User -> Frontend : Click "View Results"
activate Frontend

Frontend -> Backend : GET /simulations/{id}/results
activate Backend

Backend -> DB : SELECT simulation\nWHERE id = {id}
activate DB
DB - -> Backend : simulation_data
deactivate DB

Backend -> Backend : Verificar\np_status == "Finished"

Backend -> Processor : process_simulation_results(\nid, simulation_data)
activate Processor

Processor -> Processor : Cargar archivo .mat\n(file_data BLOB)

Processor -> Processor : Parse datos:\n• sol_sensors_y\n• sol_sensors_z\n• times

group Procesamiento Científico
  Processor -> Processor : **1. Señales Espacio-Temporales**\nNormalizar señales\n30 receptores × tiempo
  
  Processor -> Processor : **2. Valores Singulares (SVD)**\nCalcular FFT en tiempo\nSVD en frecuencias\nRango: 0-2 MHz\nEscala: dB
  
  Processor -> Processor : **3. Espectro f-k**\nFFT 2D (tiempo + espacio)\nDominio frecuencia-wavenumber\nCurvas de dispersión
end

Processor - -> Backend : {\n  spatioTemporal: {...},\n  singularValues: {...},\n  spectrumData: {...}\n}
deactivate Processor

Backend - -> Frontend : 200 OK\nJSON results
deactivate Backend

Frontend -> Frontend : Renderizar visualizaciones:\n• Recharts (señales, SVD)\n• Canvas (heatmap f-k)\n• Controles interactivos

User <- - Frontend : Visualiza resultados\ncientíficos procesados
deactivate Frontend

== Opcional: Descargar ==

User -> Frontend : Click "Download .mat"
activate Frontend

Frontend -> Backend : GET /simulations/{id}/download
activate Backend

Backend -> DB : SELECT file_data\nWHERE id = {id}
activate DB
DB - -> Backend : BLOB data
deactivate DB

Backend - -> Frontend : 200 OK\nContent-Type: application/octet-stream\nContent-Disposition: attachment
deactivate Backend

Frontend -> Frontend : Iniciar descarga\narchivo: {sim_name}.mat

User <- - Frontend : Archivo descargado
deactivate Frontend

@enduml

