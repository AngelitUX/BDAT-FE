@startuml Estados_Simulacion
!theme plain

title Diagrama de Estados - Ciclo de Vida de Simulación

[*] - -> GeneratingMesh : create()

state "Generating Mesh" as GeneratingMesh {
  GeneratingMesh : Generando malla\ncon GMSH
}

state "Not started" as NotStarted {
  NotStarted : Lista para ejecutar
}

state "Queued" as Queued {
  Queued : En cola de\nejecución
}

state "Running" as Running {
  Running : Ejecutándose\ncon FEniCS
  Running : Resolviendo\necuaciones
}

state "Finished" as Finished {
  Finished : Completada\nexitosamente
  Finished : Resultados .mat\ndisponibles
}

state "Error" as Error {
  Error : Fallo durante\nejecución
  Error : Logs disponibles
}

state "Aborting" as Aborting {
  Aborting : Abortando\nproceso
}

state "Aborted" as Aborted {
  Aborted : Abortada\npor usuario
}

GeneratingMesh - -> NotStarted : mesh_generated()
GeneratingMesh - -> Error : mesh_generation_failed()

NotStarted - -> Queued : execute()

Queued - -> Running : process_queue()
Queued - -> NotStarted : dequeue()

Running - -> Finished : finished()
Running - -> Error : error()
Running - -> Aborting : abort()

Aborting - -> Aborted : cleanup()

Finished - -> Queued : re-execute()
Error - -> Queued : re-execute()
Aborted - -> Queued : re-execute()

note right of GeneratingMesh
  Estado inicial
  Duración: 5-30 segundos
end note

note right of NotStarted
  Estado predeterminado
  Puede editarse
end note

note right of Queued
  Orden: queue_position
  Procesamiento secuencial
end note

note right of Running
  Solo 1 simultánea
  Duración: 2-60 minutos
end note

note right of Finished
  Estado terminal (éxito)
  Solo editar nombre
end note

note right of Error
  Estado terminal (fallo)
  Re-ejecutar disponible
end note

note right of Aborted
  Interrupción manual
  Re-ejecutar disponible
end note

@enduml

