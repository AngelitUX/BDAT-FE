@startuml Componentes_BDAT
!theme plain

title Diagrama de Componentes - Arquitectura BDAT

skinparam componentStyle rectangle

package "Capa de Presentación" {
  
  component [React Frontend\nPort: 3002] as Frontend {
    component [Simulations.jsx] as SimComp
    component [SimulationModal.jsx] as ModalComp
    component [MeshViewer\n(Three.js)] as MeshViewer
    component [ResultsCharts\n(Recharts)] as Charts
    component [simulationService.js\n(API Client)] as APIClient
    
    SimComp - -> APIClient
    ModalComp - -> APIClient
    MeshViewer - -> APIClient
    Charts - -> APIClient
  }
}

package "Capa de Aplicación" {
  
  component [Flask Backend\nPort: 5000] as Backend {
    component [simulations_controller.py\n(REST API)] as Controller
    component [simulations_service.py\n(Business Logic)] as Service
    component [queue_service.py\n(Queue Manager)] as QueueService
    component [simulation_model.py\n(Data Access)] as Model
    
    Controller - -> Service
    Service - -> QueueService
    Service - -> Model
  }
  
  component [Flask-SocketIO\n(WebSocket Server)] as SocketIO
}

package "Capa de Negocio" {
  
  component [GMSH Mesh Generator] as GMSH {
    component [create_rectangle_mesh()] as RectMesh
    component [create_multilayer_mesh()] as MultiMesh
  }
  
  component [FEniCS Engine] as FEniCS {
    component [TimeSimTransducerClass.py] as TimeSim
    component [Newmark β-γ Solver] as Newmark
    component [Sensor Evaluator] as SensorEval
  }
  
  component [Results Processor] as ResultsProc {
    component [FFT Calculator] as FFT
    component [SVD Calculator] as SVD
    component [f-k Spectrum] as FK
    component [octave_plot_generator.py] as OctavePlot
  }
}

package "Capa de Persistencia" {
  
  database "MySQL 8.0\nPort: 3306" as MySQL {
    component [simulations\n(table)] as SimTable
  }
}

interface "HTTP/REST" as HTTP
interface "WebSocket" as WS
interface "MySQL Protocol" as MySQLProto

APIClient -down-> HTTP
HTTP -down-> Controller
APIClient -down-> WS
WS -down-> SocketIO
SocketIO - -> Controller : emit events

Service - -> GMSH : generate_mesh()
Service - -> FEniCS : execute_simulation()
Service - -> ResultsProc : process_results()

Model -down-> MySQLProto
MySQLProto -down-> MySQL

note right of Frontend
  **Tecnologías:**
  • React 19.1
  • Three.js (3D)
  • Recharts (Gráficos)
  • Socket.IO Client
  • Fetch API
end note

note right of Backend
  **Tecnologías:**
  • Flask
  • Flask-SocketIO
  • Flask-MySQLdb
  • Python 3.11+
end note

note right of GMSH
  **Responsabilidad:**
  Generación de mallas
  computacionales
  (XML/MSH)
end note

note right of FEniCS
  **Responsabilidad:**
  Resolución de ecuaciones
  elastodinámicas 2D
  Simulación científica
end note

note right of ResultsProc
  **Responsabilidad:**
  Post-procesamiento
  científico de datos
end note

note bottom of MySQL
  **Almacenamiento:**
  • Parámetros simulación
  • Mallas (paths)
  • Resultados (BLOB)
  • Estados y timestamps
end note

@enduml

