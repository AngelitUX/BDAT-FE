@startuml Despliegue_Docker_BDAT
!theme plain

title Diagrama de Despliegue - Entorno Docker\nSistema BDAT

skinparam nodeStyle rectangle

actor "Usuario" as User
node "Navegador Web" as Browser {
  artifact "React SPA" as ReactApp
}

cloud "Docker Environment" {
  
  node "frontend:3002" as FrontendNode <<Container>> {
    artifact "node:18-alpine" as NodeImage
    component "React Dev Server" as ReactServer
    artifact "Volume: ./frontend:/app" as FrontendVol
    
    ReactServer -down-> FrontendVol
  }
  
  node "backend:5000" as BackendNode <<Container>> {
    artifact "python:3.11-slim" as PythonImage
    component "Flask Application" as FlaskApp
    component "Flask-SocketIO" as SocketIOComp
    component "FEniCS Engine" as FenicsComp
    artifact "Volume: ./backend:/app" as BackendVol
    artifact "Volume: ./meshes:/app/meshes" as MeshesVol
    
    FlaskApp -down-> BackendVol
    FenicsComp -down-> MeshesVol
  }
  
  node "mysql:3306" as MySQLNode <<Container>> {
    artifact "mysql:8.0.42" as MySQLImage
    database "BDAT Database" as BDATdb
    artifact "Volume: ./database/init.sql" as InitSQL
    artifact "Volume: mysql_data:/var/lib/mysql" as MySQLData
    
    BDATdb -down-> MySQLData
    InitSQL -down-> BDATdb : initialize
  }
  
  package "Docker Network: bdat_network" {
    FrontendNode -[hidden]down- BackendNode
    BackendNode -[hidden]down- MySQLNode
  }
}

User - -> Browser : Acceso\nhttp://localhost:3002
Browser - -> ReactApp

ReactApp - -> FrontendNode : <<deploy>>
FrontendNode - -> BackendNode : HTTP/REST\nWebSocket\nPort 5000

BackendNode - -> MySQLNode : MySQL Protocol\nPort 3306

note right of FrontendNode
  **Configuración:**
  Port: 3002:3000
  Restart: always
  Hot reload activado
  
  **Variables de entorno:**
  REACT_APP_API_URL=
    http://localhost:5000
end note

note right of BackendNode
  **Configuración:**
  Port: 5000:5000
  Restart: always
  
  **Variables de entorno:**
  MYSQL_HOST=mysql
  MYSQL_PORT=3306
  MYSQL_DATABASE=bdat
  MYSQL_USER=bdat_user
  MYSQL_PASSWORD=***
  FLASK_ENV=development
end note

note right of MySQLNode
  **Configuración:**
  Port: 3306:3306
  Restart: always
  
  **Variables de entorno:**
  MYSQL_ROOT_PASSWORD=***
  MYSQL_DATABASE=bdat
  MYSQL_USER=bdat_user
  MYSQL_PASSWORD=***
  
  **Persistencia:**
  Volume named: mysql_data
end note

note bottom of "Docker Network: bdat_network"
  Red interna para
  comunicación entre contenedores
  
  **DNS interno:**
  • frontend
  • backend
  • mysql
end note

legend right
  **Orquestación:**
  docker-compose.yml
  
  **Comandos:**
  docker-compose up -d
  docker-compose logs -f
  docker-compose down
  
  **Versiones:**
  • Docker: Latest
  • Docker Compose: v2.x
endlegend

@enduml

